<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro | Mãos que Transformam</title>
<link rel="stylesheet" href="../css/estilo.css"></head>
<body>
<header>
<img src="../imagens/logo.png" alt="Logo da ONG Mãos que Transformam" width="180">
<h1>Participe da Mãos que Transformam</h1>
<nav aria-label="Navegação principal">
<a href="index.html">Início</a> |
<a href="projetos.html">Projetos</a> |
<a href="cadastro.html">Cadastro</a>
</nav>
</header>
<main>
<form action="#" method="post">
<fieldset>
<legend>Dados pessoais</legend>
<p><label for="nome">Nome completo:</label><br>
<input id="nome" name="nome" type="text" required autocomplete="name"></p>
<p><label for="email">E-mail:</label><br>
<input id="email" name="email" type="email" required autocomplete="email"></p>
<p><label for="nascimento">Data de nascimento:</label><br>
<input id="nascimento" name="nascimento" type="date" required></p>
<p><label for="cpf">CPF:</label><br>
<input id="cpf" name="cpf" type="text" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="Somente 11 números" required title="Digite 11 números."></p>
<p><label for="telefone">Telefone:</label><br>
<input id="telefone" name="telefone" type="tel" inputmode="tel" pattern="[0-9]{10,11}" maxlength="11" placeholder="DDD + número" required title="Digite 10 ou 11 números."></p>
</fieldset>
<fieldset>
<legend>Endereço</legend>
<p><label for="cep">CEP:</label><br>
<input id="cep" name="cep" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="Somente 8 números" required title="Digite 8 números."></p>
<p><label for="endereco">Endereço:</label><br>
<input id="endereco" name="endereco" type="text" required autocomplete="street-address"></p>
<p><label for="cidade">Cidade:</label><br>
<input id="cidade" name="cidade" type="text" required autocomplete="address-level2"></p>
<p><label for="estado">Estado:</label><br>
<select id="estado" name="estado" required>
<option value="">Selecione</option><option>MT</option><option>SP</option><option>MS</option><option>GO</option><option>PR</option><option>RJ</option><option>MG</option><option>BA</option><option>DF</option><option>Outro</option>
</select></p>
</fieldset>
<fieldset>
<legend>Forma de participação</legend>
<p><label for="participacao">Como deseja participar?</label><br>
<select id="participacao" name="participacao" required>
<option value="">Selecione</option><option value="doacao">Doação</option><option value="voluntariado">Voluntariado</option><option value="ambos">Doação e voluntariado</option>
</select></p>
<p><label for="mensagem">Área de interesse ou mensagem:</label><br>
<textarea id="mensagem" name="mensagem" rows="5"></textarea></p>
</fieldset>
<p><button type="submit">Enviar cadastro</button> <button type="reset">Limpar</button></p>
</form>
</main>
<footer><p>&copy; 2026 Mãos que Transformam - ONG.</p></footer>
<script src="../js/app.js"></script>
</body>
</html>
